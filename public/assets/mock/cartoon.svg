<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="400" height="400" fill="#FFE5EC"/>
  
  <!-- 卡通猫咪示意图 -->
  <g transform="translate(200, 200)">
    <!-- 身体 -->
    <ellipse cx="0" cy="40" rx="80" ry="100" fill="#FFB6C1"/>
    
    <!-- 头部 -->
    <circle cx="0" cy="-20" r="70" fill="#FFB6C1"/>
    
    <!-- 耳朵 -->
    <path d="M -50,-60 L -40,-90 L -20,-65 Z" fill="#FFB6C1"/>
    <path d="M 50,-60 L 40,-90 L 20,-65 Z" fill="#FFB6C1"/>
    <path d="M -45,-70 L -40,-85 L -30,-68 Z" fill="#FF69B4"/>
    <path d="M 45,-70 L 40,-85 L 30,-68 Z" fill="#FF69B4"/>
    
    <!-- 眼睛 -->
    <circle cx="-25" cy="-25" r="12" fill="#FFF"/>
    <circle cx="25" cy="-25" r="12" fill="#FFF"/>
    <circle cx="-25" cy="-23" r="8" fill="#333"/>
    <circle cx="25" cy="-23" r="8" fill="#333"/>
    <circle cx="-23" cy="-26" r="4" fill="#FFF"/>
    <circle cx="27" cy="-26" r="4" fill="#FFF"/>
    
    <!-- 鼻子 -->
    <path d="M 0,-10 L -5,-5 L 5,-5 Z" fill="#FF1493"/>
    
    <!-- 嘴巴 -->
    <path d="M 0,-5 Q -15,5 -25,0" stroke="#FF1493" stroke-width="2" fill="none"/>
    <path d="M 0,-5 Q 15,5 25,0" stroke="#FF1493" stroke-width="2" fill="none"/>
    
    <!-- 胡须 -->
    <line x1="-70" y1="-15" x2="-40" y2="-10" stroke="#333" stroke-width="1.5"/>
    <line x1="-70" y1="-5" x2="-40" y2="-5" stroke="#333" stroke-width="1.5"/>
    <line x1="70" y1="-15" x2="40" y2="-10" stroke="#333" stroke-width="1.5"/>
    <line x1="70" y1="-5" x2="40" y2="-5" stroke="#333" stroke-width="1.5"/>
  </g>
  
  <!-- 文字标签 -->
  <text x="200" y="360" text-anchor="middle" font-size="24" font-weight="bold" fill="#FF1493" font-family="Arial">
    卡通效果
  </text>
</svg>
