<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="400" height="400" fill="#E0F2F7"/>
  
  <!-- 像素化猫咪 -->
  <g transform="translate(120, 120)">
    <!-- 使用方块创建像素化效果 -->
    <!-- 耳朵 -->
    <rect x="0" y="0" width="20" height="20" fill="#FF9AA2"/>
    <rect x="20" y="20" width="20" height="20" fill="#FF9AA2"/>
    <rect x="120" y="0" width="20" height="20" fill="#FF9AA2"/>
    <rect x="100" y="20" width="20" height="20" fill="#FF9AA2"/>
    
    <!-- 头部 -->
    <rect x="40" y="20" width="20" height="20" fill="#FFB7B2"/>
    <rect x="60" y="20" width="20" height="20" fill="#FFB7B2"/>
    <rect x="80" y="20" width="20" height="20" fill="#FFB7B2"/>
    
    <rect x="20" y="40" width="20" height="20" fill="#FFB7B2"/>
    <rect x="40" y="40" width="20" height="20" fill="#FFB7B2"/>
    <rect x="60" y="40" width="20" height="20" fill="#FFB7B2"/>
    <rect x="80" y="40" width="20" height="20" fill="#FFB7B2"/>
    <rect x="100" y="40" width="20" height="20" fill="#FFB7B2"/>
    
    <!-- 眼睛 -->
    <rect x="40" y="60" width="20" height="20" fill="#333"/>
    <rect x="80" y="60" width="20" height="20" fill="#333"/>
    
    <!-- 鼻子嘴巴 -->
    <rect x="60" y="80" width="20" height="20" fill="#FF1493"/>
    <rect x="40" y="100" width="20" height="20" fill="#FF1493"/>
    <rect x="80" y="100" width="20" height="20" fill="#FF1493"/>
    
    <!-- 身体 -->
    <rect x="20" y="120" width="20" height="20" fill="#FFDAC1"/>
    <rect x="40" y="120" width="20" height="20" fill="#FFDAC1"/>
    <rect x="60" y="120" width="20" height="20" fill="#FFDAC1"/>
    <rect x="80" y="120" width="20" height="20" fill="#FFDAC1"/>
    <rect x="100" y="120" width="20" height="20" fill="#FFDAC1"/>
    
    <rect x="20" y="140" width="20" height="20" fill="#FFDAC1"/>
    <rect x="40" y="140" width="20" height="20" fill="#FFDAC1"/>
    <rect x="60" y="140" width="20" height="20" fill="#FFDAC1"/>
    <rect x="80" y="140" width="20" height="20" fill="#FFDAC1"/>
    <rect x="100" y="140" width="20" height="20" fill="#FFDAC1"/>
  </g>
  
  <!-- 文字标签 -->
  <text x="200" y="360" text-anchor="middle" font-size="24" font-weight="bold" fill="#00ACC1" font-family="Arial">
    像素效果
  </text>
</svg>
